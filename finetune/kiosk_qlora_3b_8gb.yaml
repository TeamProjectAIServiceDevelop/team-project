### 키오스크 버튼 안내 QLoRA 학습 설정 (집 PC: RTX 4060 Ti 8GB, Qwen2.5-VL-3B)
### kiosk_qlora_7b.yaml과 같은 데이터 형식(앱의 1단계 JSON, 2단계 bbox_2d)인데, 8GB에 맞게 사진을 줄였다.
### 데이터 만들기 (저장소 루트에서):
###   $env:TRAIN_PIXELS = "313600"; $env:TRAIN_OUT = "train-3b"; node_modules\.bin\jiti finetune\build-train.ts
### 학습:  llamafactory-cli train finetune\kiosk_qlora_3b_8gb.yaml   (저장소 루트에서)
### 주의: 좌표는 줄인 사진(476x644 등) 기준이다. 앱에서 쓰려면 앱도 31만 픽셀 이하로 줄여 보내야 한다.

### 모델
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
quantization_bit: 4
quantization_method: bnb
# build-train.ts의 TRAIN_PIXELS와 같은 값. 이보다 작으면 학습 중에 다시 줄어 좌표가 어긋난다.
# 40만 픽셀은 8GB를 넘쳐 공유 메모리로 새고 느려졌다(블루스크린도 한 번 남). 31만은 8GB 안에서 돈다.
image_max_pixels: 313600
trust_remote_code: true

### 방법
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
# paged_adamw_8bit은 GPU가 공유 메모리로 넘칠 때 체크포인트 저장 중 멈추고 블루스크린(0x1E)이 두 번 났다. LoRA라 옵티마이저가 작아서 일반 AdamW로 충분하다.
optim: adamw_torch

### 데이터
dataset_dir: finetune/data/train-3b
dataset: kiosk_train
eval_dataset: kiosk_val
template: qwen2_vl
# 사진 토큰 약 400개 + 1단계 system 문장 + 답 (가장 긴 샘플도 1,500자 정도)
cutoff_len: 2048
preprocessing_num_workers: 1
dataloader_num_workers: 0

### 출력 (용량이 커서 저장소 밖에 둔다. 집 PC 경로)
output_dir: C:/Code/quiz/kiosk_finetune/saves/qwen25vl-3b-button
logging_steps: 5
save_strategy: steps
save_steps: 20
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### 학습
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
# 739개 ÷ 8 × 2번 ≈ 185단계의 10%
warmup_steps: 18
bf16: true

### 확인용 (85개, 한 번에 몇 분 걸려서 에폭마다만)
per_device_eval_batch_size: 1
eval_strategy: epoch
